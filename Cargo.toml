[workspace]
resolver = "2"
members = [
  "crates/zuradio-core",
  "crates/zuradio-daemon",
]
default-members = [
  "crates/zuradio-core",
  "crates/zuradio-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/GeorgeFejer91/zuradio"
authors = ["George Fejer"]

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["json", "macros", "ws"] }
base64 = "0.22.1"
blake3 = "1.8.2"
clap = { version = "4.6.6", features = ["derive", "env"] }
hmac = "0.13.0"
http = "1.4.0"
lofty = "0.25.1"
mime_guess = "2.0.5"
rand = "0.10.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "compression-gzip", "fs", "limit", "request-id", "sensitive-headers", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
ureq = { version = "3.2.0", features = ["json"] }
url = "2.5.8"
uuid = { version = "1.22.0", features = ["serde", "v4"] }
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
