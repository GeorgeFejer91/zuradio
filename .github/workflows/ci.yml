name: Verify Zuradio

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --workspace --exclude zuradio-desktop --locked
      - name: Reject Clippy warnings
        run: cargo clippy --workspace --exclude zuradio-desktop --all-targets --locked -- -D warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        working-directory: web
      - name: Audit all web dependencies
        run: npm audit
        working-directory: web
      - name: Typecheck
        run: npm run typecheck
        working-directory: web
      - name: Run unit tests
        run: npm test
        working-directory: web
      - name: Build local host and companion
        run: npm run build
        working-directory: web
      - name: Build and inspect the Pages artifact
        run: npm run build:pages
        working-directory: web
      - name: Reject music and local media routes in Pages
        run: |
          if find web/dist-pages -type f | grep -E '\.(aac|aif|aiff|alac|flac|m4a|mp3|mp4|ogg|opus|wav|webm)$'; then
            echo "Music files must never be included in the companion artifact" >&2
            exit 1
          fi
          if grep -RIl '/api/v1/media' web/dist-pages; then
            echo "The static companion must not contain the laptop media endpoint" >&2
            exit 1
          fi

  browser-verification-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Install locked browser dependencies
        run: npm ci
        working-directory: web
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build production web assets
        run: npm run build
        working-directory: web
      - name: Build the optimized Rust daemon
        run: cargo build --release -p zuradio-daemon --locked
      - name: Download checksum-verified CC0 fixtures
        run: scripts/fetch-test-music.sh
      - name: Create an isolated test password
        run: printf 'zuradio-ci-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/zuradio-password.txt"
      - name: Enforce the live browser completion gate
        run: scripts/verify-feature-completion.sh
        env:
          ZURADIO_TEST_PASSWORD_FILE: ${{ runner.temp }}/zuradio-password.txt

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux WebView development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev
      - name: Build packaged web resources
        run: npm ci && npm run build
        working-directory: web
      - name: Check the Tauri shell
        run: cargo check -p zuradio-desktop --locked
      - name: Test the Tauri shell
        run: cargo test -p zuradio-desktop --locked
      - name: Reject desktop Clippy warnings
        run: cargo clippy -p zuradio-desktop --all-targets --locked -- -D warnings
      - name: Build the host-native release binary
        run: cargo build -p zuradio-desktop --release --locked
      - name: Publish the Linux desktop binary for installation verification
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: zuradio-desktop-linux
          path: target/release/zuradio-desktop
          if-no-files-found: error
