name: Deploy Zuradio Web Companion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install locked web dependencies
        run: npm ci
        working-directory: web
      - name: Verify and build the static companion
        run: npm run typecheck && npm test && npm run build:pages
        working-directory: web
      - name: Assert that the Pages artifact contains no music
        run: |
          if find web/dist-pages -type f | grep -E '\.(mp3|flac|wav|ogg|opus|m4a|aac|aiff|alac|webm)$'; then
            echo "Music files must never be included in the companion artifact" >&2
            exit 1
          fi
          if grep -RIl '/api/v1/media' web/dist-pages; then
            echo "The static companion must not contain the laptop media endpoint" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy companion only
        id: deployment
        uses: actions/deploy-pages@v5
